name: ChemicalProductionScreen
version: "1.0.0"
description: |
  化工生产监控画面创建工作流 — 从空项目出发,完成"建画面 → 摆设备 → 绑点位 → 设报警"
  四步,最后一步交给确定性 handler 跑一遍 validate_project。
priority: 50

trigger:
  keywords: ["化工", "chemical", "reactor screen", "production screen"]
  regex:
    - "反应釜.*(画面|监控|界面|组态|展示)"
    - "(画面|界面).*反应釜"

steps:
  - id: build_page
    type: llm_step
    state: MANAGE_PAGES
    description: 创建主画面 + 设备图元(反应釜 / 泵 / 罐)
    allowed_tools:
      - create_page
      - create_widget
      - list_pages
    expected_action: create_page

  - id: place_layout
    type: llm_step
    state: GENERATE_LAYOUT
    description: 添加管道连线、文字标签、分组
    depends_on: [build_page]
    allowed_tools:
      - create_line
      - create_text
      - apply_flow_layout
      - group_widgets
      - set_widget_style
      - list_pages

  - id: bind_points
    type: llm_step
    state: BIND_POINTS
    description: 把温度、压力、液位点位绑到对应图元
    depends_on: [place_layout]
    allowed_tools:
      - bind_point
      - list_points
      - list_pages

  - id: config_alarms
    type: llm_step
    state: CONFIG_ALARM
    description: 为关键点位添加超限报警
    depends_on: [bind_points]
    allowed_tools:
      - create_analog_alarm
      - create_digital_alarm
      - set_threshold
      - list_points
    expected_action: create_analog_alarm

  - id: validate
    type: deterministic_step
    state: VALIDATE
    description: 项目一致性自检
    depends_on: [config_alarms]
    handler: handlers.validate_project
    on_failure: bind_points
