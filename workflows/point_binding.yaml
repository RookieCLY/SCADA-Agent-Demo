name: PointBinding
version: "1.0.0"
description: |
  纯绑定工作流 — 画面与点位都已经存在,只需要把已有点位绑到已有图元属性上。
priority: 30

trigger:
  keywords: ["绑定", "bind", "关联点位", "把.*绑", "把.*关联"]
  regex:
    - "绑[到上]"
    - "bind.*to"

steps:
  - id: list_targets
    type: llm_step
    state: ANALYZE_INTENT
    description: 列出可绑的图元 / 点位
    allowed_tools:
      - list_pages
      - list_points
    must_call_tool: false

  - id: bind
    type: llm_step
    state: BIND_POINTS
    depends_on: [list_targets]
    description: 执行绑定
    allowed_tools:
      - bind_point
      - list_points
      - list_pages
    expected_action: bind_point

  - id: validate
    type: deterministic_step
    state: VALIDATE
    depends_on: [bind]
    handler: handlers.validate_project
