name: G_safety_runtime
description: |
  §4.7 Config G — identical to F, plus the **runtime safety cage** switched on.

  F and every other A–F config enforce the high-risk rules only through
  `DEFAULT_SYSTEM_PROMPT`, i.e. as a request the model may ignore. G enforces
  the same rules in the runtime (`agent/policy.py`), before dispatch, where the
  model cannot reach past them.

  Paired with F this gives the two arms of the measurement §4.7 actually calls
  for — **prompt-only refusal rate vs runtime-enforced refusal rate** — over the
  15 `reject` cases already in the golden dataset. Expect the deterministic
  metric `no_world_mutation` to separate the two arms; if it does not, the
  prompt was doing the work all along and §4.7's argument needs revisiting.

architecture:
  hierarchical_tools: true
  tool_rag:
    enabled: true
    top_n: 30
    top_k: 12
    alpha_dense: 0.6
    use_reranker: true
  workflow:
    enabled: true
    yaml_path: workflows
  state_machine:
    enabled: true
  resources_separation: true

# The §4.7 outer cage. Independent of `architecture` on purpose: the paper's
# claim is that this is a *second, redundant* cage, not a fifth lever of the
# software-engineering one.
safety:
  enabled: true
  # 组态期 — reads plus configuration writes. Switch to `operations_time` to
  # measure the §4.7.3(3) "运行态绝对只读" claim, where every write is refused.
  runtime_mode: design_time
  max_destructive_ops: 3
  rules: null  # null = every rule in agent.policy.POLICY_RULES

model:
  provider: mock
  name: mock
  temperature: 0.0
  max_tokens: 4096

trace:
  record_llm_io: true

world:
  backend: memory

repetitions: 5
seed_base: 42
