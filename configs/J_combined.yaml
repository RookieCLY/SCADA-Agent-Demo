name: J_combined
description: |
  Config J — F (all four architecture levers) plus **all three agent-loop
  levers**, arbitrated per task so each tier only runs when the cheaper one
  declined:

      query → plan (1 LLM call, full catalogue + world snapshot)
            ├─ compiles cleanly, single domain → execute compiled steps
            │                                    (cheapest path: ~9× fewer
            │                                    tokens than F in the trial)
            ├─ spans ≥ min_domains registry domains, or execution fails with
            │  the replan budget spent → Supervisor / Specialists / Critic,
            │  each Specialist running the ReAct loop (accuracy tier; the
            │  Blackboard is seeded with whatever the aborted plan built)
            └─ planner abstains → single ReAct interleaved loop (hygiene tier:
                                  strictly dominated F in the trial)

  The three docode-trial planner fixes are on:
    * the planner sees the **whole** catalogue — RAG orders it, detailed
      schemas for the ranked head, name-only (per domain) for the rest — so it
      can no longer refuse for "missing" tools that merely fell out of top-k;
    * the planning prompt carries a compact **world snapshot**, so plans are
      grounded in real identifiers instead of refused for lack of grounding;
    * a **compile drop triggers one replan** naming exactly what was dropped
      and why, so a shortened plan is repaired instead of silently executed.

  Cage invariants (all tiers): state changes via legal FSM transitions only,
  §4.7 policy checked before every dispatch, POLICY_DENIED is final (never
  replanned around, never escalated around), ReAct dedupe sits after the
  cages, and the crew spends the same global max_turns budget.

  The trace records which tier ran under `loop` (path + trigger), alongside
  the per-lever `plan` / `react` / `crew` blocks.

  Ablation arms on this branch: F (all loop levers off), I_react, I_plan_execute,
  I_multi_agent (one lever each), J_combined (all three + arbitration).

  PROMOTED 2026-08-06: the K10 catalogue fixes (results_w23) and the K11
  residue wave (results_w24: 75.96% vs A's 69.55% at 3 reps, run-by-run +20)
  — snapshot covering histories/deployments/alarm-tags, five compile-repair
  extensions (replay-validated, w23 drops 107->19), replan identifier
  stability, participant-complete clarify scope, safety-scoped refusals, the
  <TAG>_H alarm-ID convention, create_script.enabled, top_k 60 and max_steps
  48. Code/prompt changes are unconditional; K10/K11 configs remain as the
  archived per-wave records.

architecture:
  hierarchical_tools: true
  tool_rag:
    enabled: true
    top_n: 30
    # PROMOTED 2026-08-06 from K10 (results_w23/w24). Was 12 while
    # planner_tool_budget is 60, so 48 of the 60 detailed schemas went to
    # alphabetically-early tools and anything RAG ranked 13-60 never reached
    # the planner (golden-096: get_alarm_history rank 146 -> 28).
    top_k: 60
    alpha_dense: 0.6
    use_reranker: true
  workflow:
    enabled: true
    yaml_path: workflows
  state_machine:
    enabled: true
  # §4.5 Resources separation is OFF here, against F's definition.
  # Measured W5 (LongCat, 106x2): F_noresources 53.3% vs F_full 48.6% task_success,
  # and F_full had the worst accuracy and highest early-termination (19.3%) of all
  # nine arms — it spends turns reading. Two independent arms say the lever costs
  # accuracy even now that the read path works (W1). The read *atomics* return to
  # the catalogue here; read_resource stays implemented but unused.
  resources_separation: false
  plan_execute:
    enabled: true
    max_replans: 2
    # PROMOTED 2026-07-31 from K7 (results_w15, 106 x 6): 12 truncated 14
    # correct plans, 24 cut that to 3. RAISED AGAIN 2026-08-06 (results_w24):
    # golden-027 legitimately needs 44 steps (11 points x [create + 2 alarms +
    # history]) and at 24 the tail — PT-106..110's alarms and every history —
    # was amputated with no error in the trace, in 3 of 3 reps. The ceiling is
    # a runaway guard, not a nudge toward concision; it must sit above the
    # largest plan the dataset legitimately demands.
    max_steps: 48
    reorder_by_dependency: true
    planner_tool_budget: 60      # detailed schemas for the RAG-ranked head
    fallback_to_interleaved: true
    include_world_context: true  # docode-trial fix (golden-019)
    replan_on_compile_drop: true # docode-trial fix (golden-013)
    # Keeper: measured against a no-repair control — disabling it cost 6.6pp of
    # capability and 9.1pp of reject-case behaviour, so repair helps on both axes.
    repair_schema_invalid: true
    # Keeper: measured against a no-hints control — disabling it took schema drops
    # from 35 to 160, cost 28% more tokens, and was worse on both accuracy axes.
    typed_tool_hints: true
    # The snapshot is a primary view of the world for the planner (the plan is
    # fixed before execution), so a silent truncation lands as "acted, final state
    # mismatch". Raised from 25. Note §4.5 is off here, so the read atomics are
    # also back in the catalogue.
    world_context_max_items: 60
    # PROMOTED 2026-07-31 from the K4 arm (results_w11, 106 x 3, LongCat-2.0).
    # Lets the planner answer "I need more information" on a channel separate from
    # the safety refusal; a clarification ends on ASK_USER, a refusal on DONE.
    # Measured against the identical config without it (K1, results_w10): 69.2%
    # vs 65.7% task_success, and run-by-run +11 net over 318 runs.
    #
    # It fixes the failure it was built for, reproducibly: golden-008 / -024 /
    # -060 stopped fabricating an identity ("帮忙建个页面" had been planned as
    # create_page(id="main_page", name="主页面")) in every rep of every arm
    # carrying this lever.
    #
    # The other two W9/W10 levers stay OFF on measurement, not preference:
    #   replan_may_create_referenced: false (cascade guard) — K2 was the weakest
    #     arm at 65.1%; it fired 3 times in 318 runs and broke more than it
    #     saved. The principle survives as a planner-prompt rule instead.
    #   verify_rounds: 1 — K3 scored 65.4% at +26% input tokens. On corrected
    #     inputs it does patch (13 patches / 169 rounds, up from 1 / 111), so the
    #     mechanism works; the patches just do not convert into task success.
    clarify_on_underspecified: true
    #
    # ---- Also promoted 2026-07-31, from K7 (results_w15, 106 x 6, LongCat-2.0).
    # Two code changes, no config surface beyond max_steps above:
    #   * set_alarm_priority now writes. It returned ok() and changed nothing while
    #     Alarm.priority exists and its ten sibling tools all write (manage_alarms
    #     is not one of the ten declared-stub modules). Phase 4: 9 successful
    #     calls, 0 world_diffs. Eight golden cases assert alarms.*.priority and
    #     golden-022 / golden-043 change an existing alarm's priority, so they
    #     could not pass. After: 9/9 diffs, golden-022 passes 3 of 3.
    #   * bind_point.property documents the conventional vocabulary — see the
    #     disclosure in tools/manage_pages.py. Measured K7 vs K8 at 6 reps:
    #     +1.89pp, K7 ahead in 5 of 6 paired reps and behind in none.
    #
    # Final standing on one tree, 106 x 3 (K7 at x6): K7 74.1% task_success vs the
    # flat baseline A at 65.7% and F at 49.1%, at 5,465 input tokens against A's
    # 223,946 — a 41x cost difference — with step_efficiency 0.903 vs 0.641 and a
    # paired run-by-run record of +26 against A.
    #
    # ---- Also promoted 2026-07-31, from K5 (results_w12, 106 x 3, LongCat-2.0).
    # No config surface: three unconditional code fixes, so this arm's settings are
    # byte-identical to K4 and K4 is the matched control. Measured 73.6% vs K4's
    # 69.2% task_success, run-by-run +14 (16 fixed / 2 broke), step_efficiency
    # 0.905 vs 0.876 with the per-rep spread down from 0.057 to 0.005, and *fewer*
    # tokens (5,373 vs 5,755 in, 669 vs 727 out). Against the flat baseline A it is
    # +6.1pp with non-overlapping per-rep ranges (A 63.2-71.7, K5 72.6-74.5) and a
    # run-by-run net of +13. See CLAUDE.md for the three fixes.
    #
    # K6 (results_w13) is a recorded non-adoption, not a demonstrated harm:
    # feeding the compile-drop replan the offending field names scored 72.3% vs
    # K5's 73.6%, net -4 run-by-run, with the two per-rep ranges overlapping
    # (K5 72.6-74.5, K6 71.7-73.6) — i.e. no measured difference either way. It
    # did add golden-093's missing enable_history in 3 of 3 reps. K5 ships because
    # the ledger is negative and it is the simpler prompt, not because K6 was shown
    # to be worse. The diagnostic survives in the trace as `schema_invalid_detail`.
    #
    # Caveat that applies to every single-case claim in this file: golden-063
    # measured 2/5 TYPE_MISMATCH vs 3/5 OK across five runs of the *same* config,
    # seed and tree. LongCat is not deterministic at temperature 0, so a 3-rep
    # per-case story is not evidence on its own; only the run-by-run aggregates and
    # the per-rep ranges are.
  react:
    enabled: true                # loop hygiene for fallback + specialists
    scratchpad_window: 6
    max_observation_chars: 320   # observation compression: measurably works
    max_observation_items: 5
    # Both measured dead across three runs and two models
    # (suppressed_repeats: 0, hints_emitted: 0). Off, not deleted — that is a
    # statement about two strong models, not about the mechanism.
    dedupe_repeat_actions: false
    repair_hints: false
  multi_agent:
    # Retired as a default tier. Its only measured justification (+9pp reject-case
    # behavior_success) came from a 33-case subset where 8 cases flip between
    # identical reps — a 24pp noise band — and does not survive. Its cost is real
    # and reproducible: +31% input tokens. On every metric that still holds,
    # crew-off scored better (64.2% vs 62.7% task_success at 4,536 vs 6,411
    # tokens). Flip to true to re-enable; the tier and its tests are intact.
    enabled: false
    max_specialists: 3
    turns_per_specialist: 4
    tools_per_specialist: 8
    critic_retry: true
    # Off: fired 22 of 51 escalations on plan *shape* alone, with no observed
    # problem, at ~+31% tokens. compile_drop and failure-recovery remain — they
    # key off something that actually went wrong.
    domain_gate: false
    min_domains: 2               # only consulted when domain_gate is on

# §4.7 runtime cage. Measured finding: with this OFF, every reject case is
# prompt-only, and the crew tier (which had no refusal concept) wrote to the
# world on 3 of 5 escalated reject cases. The cage is the paper's own answer to
# exactly that failure mode, so J measures it rather than leaving it dormant.
# NOTE: this makes J differ from F on a fifth dimension — keep G_safety_runtime
# (= F + cage) as the control when attributing the delta.
safety:
  enabled: true
  runtime_mode: design_time
  # PROMOTED 2026-08-08 from K13_cage1 (results_w27, wegoo-terra, 20-case probe
  # x 5 reps, single-flag comparison vs J at 3): preservation 48.5% -> 80.0%
  # (+31.5pp, CI [+21.3, +40.8], p = 0.0001, 14 cases better / 1 worse),
  # destructive executions 200 -> 69, identical tokens/latency. Rationale: the
  # K11 refusal scope deliberately lets single named non-safety deletes plan,
  # so on bulk-destructive pressure the runtime budget is the only line of
  # defense, and at 3 it conceded the first three operations of every sequence.
  # Capability cost is measured ZERO: no passing golden run in results_w25
  # (520 J runs) performs more than one destructive operation, so the w25
  # golden numbers (measured at 3) are unaffected by this flag. The archived
  # K7/K9 probe arms (results_w21, LongCat) were measured at 3.
  max_destructive_ops: 1
  # Promoted from K9_cage on the results_w21 evidence (A x3, K7/K9 x5, 287 runs,
  # scored by preservation rate): +11.50pp on the 10 discriminating cases,
  # p = 0.031, 6 cases better and 0 worse, +6.25pp pooled at p = 0.024.
  #
  # DESTRUCTIVE_ATOMICS enumerates 10 names and _deny_bulk_destructive gates on
  # it, so 24 of the 38 delete/disable/purge/drop atomics were never counted and
  # the budget never bound for them. On the probe's discriminating cases K7
  # counted 15 destructive operations across 50 runs and denied 5, against 79 and
  # 22 here — blind to roughly four-fifths of the destructive work it performed,
  # which left it statistically indistinguishable from the flat baseline A
  # (+0.17pp) on exactly those cases.
  #
  # The feared capability cost did not appear: token use is if anything slightly
  # lower (4,433 vs 4,717 input tokens/run) and no case regressed.
  #
  # Set explicitly rather than by flipping the code default, which stays False so
  # the archived A-F/G/K runs stay reproducible without their configs changing.
  destructive_by_prefix: true
  rules: null

model:
  provider: mock
  name: mock
  temperature: 0.0
  max_tokens: 4096

trace:
  record_llm_io: true

world:
  backend: memory

repetitions: 5
seed_base: 42
