name: J_nocrew
description: |
  J minus the Multi-Agent escalation tier — the control for "does the crew earn
  its keep?".

  Measured on the 106-case docode run, J's crew handled 23% of cases but burned
  **61% of all tokens** (18.9k/case and 70.6s, against the plan path's 3.6k and
  7.2s). That is a large price, and nothing yet shows what accuracy it buys.

  This config is byte-identical to J_combined except `multi_agent.enabled`, so
  the delta is attributable to the crew alone. It is deliberately *not* the
  `I_plan_execute` arm: that branch is frozen pre-P1 (schema repair), so
  comparing it against today's J would confound the crew's value with P1's.

  Escalations that would have gone to the crew instead fall back to the
  interleaved ReAct loop, which is the honest "no crew available" behaviour.

architecture:
  hierarchical_tools: true
  tool_rag:
    enabled: true
    top_n: 30
    top_k: 12
    alpha_dense: 0.6
    use_reranker: true
  workflow:
    enabled: true
    yaml_path: workflows
  state_machine:
    enabled: true
  # §4.5 Resources separation is OFF here, against F's definition.
  # Measured W5 (LongCat, 106x2): F_noresources 53.3% vs F_full 48.6% task_success,
  # and F_full had the worst accuracy and highest early-termination (19.3%) of all
  # nine arms — it spends turns reading. Two independent arms say the lever costs
  # accuracy even now that the read path works (W1). The read *atomics* return to
  # the catalogue here; read_resource stays implemented but unused.
  resources_separation: false
  plan_execute:
    enabled: true
    max_replans: 2
    max_steps: 12
    reorder_by_dependency: true
    planner_tool_budget: 60      # detailed schemas for the RAG-ranked head
    fallback_to_interleaved: true
    include_world_context: true  # docode-trial fix (golden-019)
    replan_on_compile_drop: true # docode-trial fix (golden-013)
  react:
    enabled: true                # loop hygiene for fallback + specialists
    scratchpad_window: 6
    max_observation_chars: 320
    max_observation_items: 5
    dedupe_repeat_actions: true
    repair_hints: true
  multi_agent:
    enabled: false               # <-- THE LEVER UNDER TEST (J has this on)
    max_specialists: 3
    turns_per_specialist: 4
    tools_per_specialist: 8
    critic_retry: true
    min_domains: 2               # crew only for genuinely multi-domain plans

# §4.7 runtime cage. Measured finding: with this OFF, every reject case is
# prompt-only, and the crew tier (which had no refusal concept) wrote to the
# world on 3 of 5 escalated reject cases. The cage is the paper's own answer to
# exactly that failure mode, so J measures it rather than leaving it dormant.
# NOTE: this makes J differ from F on a fifth dimension — keep G_safety_runtime
# (= F + cage) as the control when attributing the delta.
safety:
  enabled: true
  runtime_mode: design_time
  max_destructive_ops: 3
  rules: null

model:
  provider: mock
  name: mock
  temperature: 0.0
  max_tokens: 4096

trace:
  record_llm_io: true

world:
  backend: memory

repetitions: 5
seed_base: 42
