name: docode_smoke
description: |
  Smoke-test config for the docode (OpenAI-compatible) real LLM. Uses the flat
  tool surface with the state machine OFF so that the model can directly emit any
  atomic tool call without state-transition orchestration. Same shape as
  configs/A_flat_baseline.yaml but with the model provider swapped.

architecture:
  hierarchical_tools: false
  tool_rag:
    enabled: false
  workflow:
    enabled: false
  state_machine:
    enabled: false
  resources_separation: false

model:
  provider: docode
  # Config ``name`` overrides DOCODE_MODEL in build_llm. Use ``name: ""`` to
  # follow the .env default instead — omitting the key entirely does *not*
  # work, since ModelConfig.name defaults to the literal "mock".
  name: gpt-5.6-luna
  temperature: 0.0
  max_tokens: 1024

trace:
  record_llm_io: true

world:
  backend: memory

repetitions: 1
seed_base: 42
