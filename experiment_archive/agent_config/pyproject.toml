[project]
name = "scada-agent-demo"
version = "0.1.0"
description = "SCADA Agent Demo — four-in-one architecture validation experiment"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "loguru>=0.7,<1",
    "typing-extensions>=4.9",
    "rank-bm25>=0.2,<1",
    "numpy>=1.20",
    "openai",
]

[project.optional-dependencies]
# Phase 2+ — pulled in once we wire RAG/LangGraph/LLM
full = [
    "langgraph>=0.2,<0.3",
    "litellm>=1.40,<2",
    "chromadb>=0.5,<0.6",
    "sentence-transformers>=2.7",
    "langfuse>=2.30",
    "pandas>=2.2",
    "polars>=0.20",
    "scipy>=1.11",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "duckdb>=1.0",
    "deepeval>=0.21",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "world", "resources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
